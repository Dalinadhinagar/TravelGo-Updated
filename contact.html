<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TravelGo - Contact</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">

        <div class="container">

            <a class="navbar-brand fw-bold"
                href="index.html">

                ✈️ TravelGo

            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link"
                            href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                            href="destinations.html">
                            Destinations
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                            href="packages.html">
                            Packages
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                            href="about.html">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                            href="contact.html">
                            Contact
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <section class="page-header">

        <div class="container">

            <h1>
                Plan Your Trip ✈️
            </h1>

            <p>
                Tell us where you want to go!
            </p>

        </div>

    </section>


    <section class="contact-section">

        <div class="container">

            <div class="contact-box">

                <h2>
                    Booking Form
                </h2>

                <p>
                    Fill in the details below.
                </p>


                <form id="bookingForm">

                    <div class="mb-3">

                        <label for="name"
                            class="form-label">

                            Name

                        </label>

                        <input
                            type="text"
                            id="name"
                            class="form-control"
                            placeholder="Enter your name">

                    </div>


                    <div class="mb-3">

                        <label for="email"
                            class="form-label">

                            Email

                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Enter your email">

                    </div>


                    <div class="mb-3">

                        <label
                            for="destination"
                            class="form-label">

                            Destination

                        </label>

                        <select
                            id="destination"
                            class="form-select">

                            <option value="">
                                Select a destination
                            </option>

                            <option value="Bali">
                                Bali
                            </option>

                            <option value="Paris">
                                Paris
                            </option>

                            <option value="Switzerland">
                                Switzerland
                            </option>

                            <option value="Maldives">
                                Maldives
                            </option>

                            <option value="Japan">
                                Japan
                            </option>

                            <option value="Dubai">
                                Dubai
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label
                            for="message"
                            class="form-label">

                            Message

                        </label>

                        <textarea
                            id="message"
                            class="form-control"
                            rows="4"
                            placeholder="Tell us about your trip"></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn submit-btn">

                        Submit Booking ✈️

                    </button>

                </form>


                <div
                    id="successMessage"
                    class="success-message">

                    🎉 Your booking request was submitted
                    successfully!

                </div>

            </div>

        </div>

    </section>


    <footer>

        <p>✈️ TravelGo</p>

        <small>
            Explore • Travel • Enjoy 🌎
        </small>

    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="script.js"></script>

</body>

</html>
