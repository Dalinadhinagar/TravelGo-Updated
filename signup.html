<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelGo | Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-image signup-image">

        <div class="auth-overlay"></div>

        <div class="auth-image-content">

            <a href="index.html" class="logo">
                Travel<span>Go</span>
            </a>

            <h1>Start Your Journey</h1>

            <p>
                Create an account and discover a world of adventures.
            </p>

        </div>

    </div>

    <div class="auth-form-area">

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

        <div class="auth-form">

            <p class="section-label">JOIN TRAVELGO</p>

            <h2>Create <span>Account</span></h2>

            <p class="auth-description">
                Sign up and start planning your dream trips.
            </p>

            <form id="signupForm">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        required
                        placeholder="Enter your name"
                    >

                </div>

                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        required
                        placeholder="Enter your email"
                    >

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="signupPassword"
                            required
                            placeholder="Create a password"
                        >

                        <button
                            type="button"
                            onclick="togglePassword('signupPassword', this)"
                        >
                            Show
                        </button>

                    </div>

                </div>

                <div class="form-group">

                    <label>Confirm Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            required
                            placeholder="Confirm your password"
                        >

                        <button
                            type="button"
                            onclick="togglePassword('confirmPassword', this)"
                        >
                            Show
                        </button>

                    </div>

                </div>

                <button type="submit" class="btn primary-btn auth-btn">
                    Create Account
                </button>

                <div id="signupError" class="error-message">
                    Passwords do not match.
                </div>

                <div id="signupSuccess" class="success-message">
                    Account created successfully!
                </div>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="signin.html">Sign in</a>
            </p>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
