<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelGo | Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-image">

        <div class="auth-overlay"></div>

        <div class="auth-image-content">

            <a href="index.html" class="logo">
                Travel<span>Go</span>
            </a>

            <h1>Welcome Back!</h1>

            <p>
                Your next adventure is waiting for you.
            </p>

        </div>

    </div>

    <div class="auth-form-area">

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

        <div class="auth-form">

            <p class="section-label">WELCOME BACK</p>

            <h2>Sign <span>In</span></h2>

            <p class="auth-description">
                Sign in to continue planning your adventures.
            </p>

            <form id="signinForm">

                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="signinEmail"
                        required
                        placeholder="Enter your email"
                    >

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="signinPassword"
                            required
                            placeholder="Enter your password"
                        >

                        <button
                            type="button"
                            onclick="togglePassword('signinPassword', this)"
                        >
                            Show
                        </button>

                    </div>

                </div>

                <button type="submit" class="btn primary-btn auth-btn">
                    Sign In
                </button>

                <div id="signinSuccess" class="success-message">
                    Signed in successfully!
                </div>

            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </p>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
